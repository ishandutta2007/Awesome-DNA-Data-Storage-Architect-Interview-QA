<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2980" />
      <stop offset="100%" stop-color="#26D0CE" />
      <animate attributeName="x1" values="0%;100%;0%" dur="10s" repeatCount="indefinite" />
      <animate attributeName="y1" values="0%;100%;0%" dur="10s" repeatCount="indefinite" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="800" height="200" fill="url(#bg)" rx="15" />
  <g transform="translate(400, 100)" text-anchor="middle" font-family="Arial, sans-serif">
    <text y="-15" font-size="36" font-weight="bold" fill="#ffffff" filter="url(#glow)">Awesome DNA Data Storage</text>
    <text y="30" font-size="24" fill="#e0f7fa">Architect Interview Q&amp;A</text>
  </g>
  <!-- Animated DNA helix abstract representation -->
  <g stroke="#ffffff" stroke-width="2" opacity="0.6">
    <path d="M 50 100 Q 100 50 150 100 T 250 100" fill="none">
       <animate attributeName="d" values="M 50 100 Q 100 50 150 100 T 250 100; M 50 100 Q 100 150 150 100 T 250 100; M 50 100 Q 100 50 150 100 T 250 100" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M 50 100 Q 100 150 150 100 T 250 100" fill="none">
       <animate attributeName="d" values="M 50 100 Q 100 150 150 100 T 250 100; M 50 100 Q 100 50 150 100 T 250 100; M 50 100 Q 100 150 150 100 T 250 100" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M 550 100 Q 600 50 650 100 T 750 100" fill="none">
       <animate attributeName="d" values="M 550 100 Q 600 50 650 100 T 750 100; M 550 100 Q 600 150 650 100 T 750 100; M 550 100 Q 600 50 650 100 T 750 100" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M 550 100 Q 600 150 650 100 T 750 100" fill="none">
       <animate attributeName="d" values="M 550 100 Q 600 150 650 100 T 750 100; M 550 100 Q 600 50 650 100 T 750 100; M 550 100 Q 600 150 650 100 T 750 100" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
